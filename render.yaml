# Render Blueprint: one free web service. The database lives on Neon (free,
# no expiration) — Render just needs its connection string.
#
# In Render: New + -> Blueprint -> connect this repo. Render reads this file and
# prompts you to paste DATABASE_URL (get it from the Neon dashboard).

services:
  - type: web
    name: purim-platform
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
